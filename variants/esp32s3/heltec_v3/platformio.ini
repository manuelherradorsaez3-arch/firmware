[env:heltec-v3] 
extends = esp32s3_base
board = heltec_wifi_lora_32_V3
board_level = pr
board_check = true
board_build.partitions = default_8MB.csv
build_unflags = 
  -flto
build_flags = 
  ${esp32s3_base.build_flags}
  -fno-lto
  -D HELTEC_V3
  -I variants/esp32s3/heltec_v3
  -D GPS_POWER_TOGGLE
lib_deps = 
  ${esp32s3_base.lib_deps}
